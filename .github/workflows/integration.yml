name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/integration_tests/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/integration.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/integration_tests/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/integration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install deps (dev+api+grpc, frozen)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra api --extra grpc

      - name: Check generated gRPC stubs are current
        run: make grpc-check

      - name: Run integration tests
        run: |
          set -euo pipefail
          uv run --frozen pytest -q tests/integration_tests
