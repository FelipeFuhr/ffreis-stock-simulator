name: Examples

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "examples/**"
      - "src/**"
      - "proto/**"
      - "scripts/**"
      - "container/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/examples.yml"
  push:
    branches: [ main ]
    paths:
      - "examples/**"
      - "src/**"
      - "proto/**"
      - "scripts/**"
      - "container/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/examples.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build and run API+gRPC smoke example
        run: |
          set -euo pipefail
          make smoke-api-grpc
