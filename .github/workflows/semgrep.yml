name: Semgrep Code Analysis

permissions: {}

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    permissions:
      contents: read
    uses: ffreis-org/ffreis-workflows-python/.github/workflows/python-semgrep.yml@v1.0.1
