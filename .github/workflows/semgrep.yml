name: Semgrep Code Analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "scripts/**"
      - "proto/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container/**"
      - "Makefile"
      - ".github/workflows/semgrep.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "scripts/**"
      - "proto/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container/**"
      - "Makefile"
      - ".github/workflows/semgrep.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-semgrep.yml@v1.0.1
