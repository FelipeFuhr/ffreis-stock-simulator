name: Commit Checks (pre-commit)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "scripts/**"
      - "proto/**"
      - "docs/openapi.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - "Makefile"
      - ".github/workflows/commit-checks.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "scripts/**"
      - "proto/**"
      - "docs/openapi.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - "Makefile"
      - ".github/workflows/commit-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          enable-cache: true

      - name: Check lock present
        run: test -s uv.lock || (echo "uv.lock missing - run uv lock"; exit 1)

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra api --extra grpc

      - name: Cache pre-commit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-py313-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Unit tests
        run: uv run --frozen python -m pytest -q tests/unit_tests
