name: Commit Checks (pre-commit)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "scripts/**"
      - "proto/**"
      - "docs/openapi.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - "Makefile"
      - ".github/workflows/commit-checks.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "scripts/**"
      - "proto/**"
      - "docs/openapi.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - "Makefile"
      - ".github/workflows/commit-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-checks:
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-test.yml@v1.0.1
    with:
      python-version: "3.13"
      uv-extras: "dev api grpc"
      test-dir: "tests/unit_tests"
