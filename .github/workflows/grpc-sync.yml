name: gRPC Sync

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  grpc-sync-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ffreis-stock-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Install dependencies (uv)
        run: |
          uv sync --frozen --extra dev --extra grpc

      - name: Check generated gRPC stubs are current
        run: make grpc-check

      - name: Run gRPC/API parity tests
        run: make test-grpc-parity

      - name: Run live interface parity test
        run: uv run --frozen pytest -q tests/integration_tests/test_live_interface_parity.py
