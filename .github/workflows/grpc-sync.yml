name: gRPC Sync

permissions: {}

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grpc-sync-and-parity:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-run-commands.yml@v1.2.0
    with:
      setup-python: true
      python-version: "3.13"
      setup-uv: true
      timeout-minutes: 30
      commands: |-
        set -euo pipefail
        uv sync --frozen --extra dev --extra api --extra grpc
        make grpc-check
        make test-grpc-parity
        uv run --frozen pytest -q tests/integration_tests/test_live_interface_parity.py
