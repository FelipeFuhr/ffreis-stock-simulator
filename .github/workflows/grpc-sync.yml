name: gRPC Sync

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  grpc-sync-and-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffreis-stock-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,grpc]"

      - name: Check generated gRPC stubs are current
        run: make grpc-check

      - name: Run gRPC/API parity tests
        run: make test-grpc-parity

      - name: Run live interface parity test
        run: uv run --extra dev --extra grpc pytest -q tests/integration_tests/test_live_interface_parity.py
