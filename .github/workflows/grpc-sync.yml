name: gRPC Sync

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  grpc-sync-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install dependencies (uv)
        run: |
          uv sync --frozen --extra dev --extra api --extra grpc

      - name: Check generated gRPC stubs are current
        run: make grpc-check

      - name: Run gRPC/API parity tests
        run: make test-grpc-parity

      - name: Run live interface parity test
        run: uv run --frozen pytest -q tests/integration_tests/test_live_interface_parity.py
