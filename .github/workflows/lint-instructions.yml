name: Lint Instructions

# Guardrail for the AGENTS.md rules/reference split (see AGENTS.md § "Where
# the rest lives"): fails if a section the manifest maps to a reference file
# ever goes missing or empty, or if a .claude/rules/*.md file lacks the
# `paths:` frontmatter that makes it load at all. `make lint-instructions`
# is pure bash + inline python3 (zero deps), so this mirrors the direct-job
# shape this repo already uses in examples.yml rather than a new mechanism.

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - "AGENTS.md"
      - ".claude/reference/_manifest.json"
      - ".claude/reference/**"
      - ".claude/rules/**"
      - "scripts/check-instructions.sh"
      - "Makefile"
      - ".github/workflows/lint-instructions.yml"
  push:
    branches: [ main ]
    paths:
      - "AGENTS.md"
      - ".claude/reference/_manifest.json"
      - ".claude/reference/**"
      - ".claude/rules/**"
      - "scripts/check-instructions.sh"
      - "Makefile"
      - ".github/workflows/lint-instructions.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-instructions:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify instruction split is intact
        run: make lint-instructions
