name: Code Review (Lint + Test)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "docs/openapi.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/code-review.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "docs/openapi.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/code-review.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          enable-cache: true

      - name: Check lock present
        run: test -s uv.lock || (echo "uv.lock missing - run uv lock"; exit 1)

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra api --extra grpc

      - name: gRPC stub sync check
        run: make grpc-check

      - name: OpenAPI contract check
        run: make openapi-check

      - name: Ruff lint
        run: make lint

      - name: MyPy
        run: make typecheck

      - name: Test suite
        run: make test
