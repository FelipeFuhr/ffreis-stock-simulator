name: Code Security (Dependency Audit)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/code-security.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/code-security.yml"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deps-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra api --extra grpc

      - name: Audit dependencies (pip-audit)
        run: |
          set -euo pipefail
          # pip-audit cannot resolve editable local project entries with hash-locked exports.
          # Audit third-party dependencies only.
          uv export \
            --frozen \
            --all-extras \
            --format requirements-txt \
            --no-emit-project \
            --no-hashes \
            -o /tmp/requirements.txt
          uv run --with pip-audit python -m pip_audit -r /tmp/requirements.txt
