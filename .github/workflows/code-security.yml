name: Code Security (Dependency Audit)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/code-security.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/code-security.yml"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deps-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra api --extra grpc

      - name: Audit dependencies (pip-audit)
        run: |
          set -euo pipefail
          # pip-audit cannot resolve editable local project entries with hash-locked exports.
          # Audit third-party dependencies only.
          uv export \
            --frozen \
            --all-extras \
            --format requirements-txt \
            --no-emit-project \
            --no-hashes \
            -o /tmp/requirements.txt
          uv run --with pip-audit python -m pip_audit -r /tmp/requirements.txt
