name: Code Coverage (Codecov)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/coverage.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/coverage.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-coverage.yml@v1.0.5
    with:
      python-version: "3.13"
      uv-extras: "dev api grpc"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
