name: Hypothesis Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "tests/integration_tests/test_grpc_parity.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/hypothesis-integration.yml"
  schedule:
    - cron: "15 10 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grpc-property-parity-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: |
          uv sync --frozen --extra dev --extra api --extra grpc

      - name: Generate and verify gRPC stubs
        run: |
          ./scripts/generate_grpc_stubs.sh
          ./scripts/check_grpc_stubs.sh

      - name: Run gRPC property parity tests
        env:
          HYPOTHESIS_MAX_EXAMPLES: "35"
        run: |
          uv run --frozen pytest -q tests/integration_tests/test_grpc_parity.py -m property

      - name: Upload Hypothesis examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-examples-pr-${{ github.run_id }}
          if-no-files-found: ignore
          path: .hypothesis/examples/

  grpc-property-parity-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: |
          uv sync --frozen --extra dev --extra api --extra grpc

      - name: Generate and verify gRPC stubs
        run: |
          ./scripts/generate_grpc_stubs.sh
          ./scripts/check_grpc_stubs.sh

      - name: Run gRPC property parity tests
        env:
          HYPOTHESIS_MAX_EXAMPLES: "160"
        run: |
          uv run --frozen pytest -q tests/integration_tests/test_grpc_parity.py -m property

      - name: Upload Hypothesis examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-examples-nightly-${{ github.run_id }}
          if-no-files-found: ignore
          path: .hypothesis/examples/
