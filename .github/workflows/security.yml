name: Code Security (Dependency Audit)

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "proto/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "14 11 15 * *"  # monthly scattered (was: 0 9 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deps-security:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-security.yml@d501e7feebe90f3e9f0f6a5da4ccf0d0ae6e6aec # v1.5.1
    with:
      python-version: "3.13"
      uv-extras: "dev api grpc"
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
