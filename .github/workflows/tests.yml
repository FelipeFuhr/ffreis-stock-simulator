name: Unit Tests

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/unit_tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/tests.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/unit_tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-test.yml@8405bfc6e887b6e1af634a6ed104538ab98d3baf # main (post-#98)
    with:
      python-version: "3.13"
      uv-extras: "dev api grpc"
      test-dir: "tests/unit_tests"
      coverage-min: 90
