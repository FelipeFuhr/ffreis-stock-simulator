name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/unit_tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/tests.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/unit_tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Install deps (dev+grpc, frozen)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra grpc

      - name: Run unit tests
        run: |
          set -euo pipefail
          uv run --frozen pytest -q tests/unit_tests \
            --cov=src \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term \
            --cov-fail-under=0
          test -s coverage-unit.xml

      - name: Upload unit coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: ./coverage-unit.xml
          flags: unit
          name: unit-coverage
          fail_ci_if_error: false
          verbose: true
