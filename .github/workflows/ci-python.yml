name: CI Python

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ffreis-stock-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: |
          test -s uv.lock || (echo "uv.lock missing - run uv lock"; exit 1)
          uv sync --frozen --extra dev --extra grpc

      - name: gRPC stub sync check
        run: make grpc-check

      - name: OpenAPI contract check
        run: make openapi-check

      - name: Ruff
        run: uv run --frozen ruff check src tests benchmarks

      - name: MyPy
        run: uv run --frozen mypy

      - name: Pytest + Coverage Threshold
        run: uv run --frozen pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Live API/gRPC E2E Tests
        run: uv run --frozen pytest -q tests/e2e_tests tests/integration_tests/test_live_interface_parity.py

      - name: step_many Throughput Smoke Threshold
        run: make test-throughput-smoke

      - name: Benchmark Smoke Test
        run: uv run --frozen python -m benchmarks.bench_step --steps 5000 --series-length 512

      - name: Build Wheel
        run: uv run --frozen --with build python -m build --wheel

      - name: Install Wheel And Import
        run: |
          uv run --frozen pip uninstall -y ffreis-stock-simulator || true
          uv run --frozen pip install dist/*.whl
          uv run --frozen python -c "import stock_simulator; print(stock_simulator.__all__)"
