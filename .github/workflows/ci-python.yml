name: CI Python

on:
  workflow_dispatch:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: |
          test -s uv.lock || (echo "uv.lock missing - run uv lock"; exit 1)
          uv sync --frozen --extra dev --extra api --extra grpc

      - name: gRPC stub sync check
        run: make grpc-check

      - name: OpenAPI contract check
        run: make openapi-check

      - name: Ruff
        run: uv run --frozen ruff check src tests benchmarks

      - name: MyPy
        run: uv run --frozen mypy

      - name: Pytest + Coverage Threshold
        run: uv run --frozen pytest -q tests/unit_tests --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Build Wheel
        run: uv run --frozen --with build python -m build --wheel

      - name: Install Wheel And Import
        run: |
          uv run --frozen pip uninstall -y ffreis-stock-simulator || true
          uv run --frozen pip install dist/*.whl
          uv run --frozen python -c "import stock_simulator; print(stock_simulator.__all__)"
