name: DevOps / Stale

permissions: {}

on:
  schedule:
    - cron: "36 12 3 * *"  # monthly scattered (was: 0 6 * * 1)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-stale.yml@c05b308fe568045ac1c8086436cca5011b809454 # v2.0.0
    with:
      only: "both"
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
