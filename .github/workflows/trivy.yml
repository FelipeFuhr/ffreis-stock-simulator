name: Container Vulnerability Scan (Trivy)
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container/**"
      - "scripts/**"
      - ".trivyignore.yaml"
      - "Makefile"
      - ".github/workflows/trivy.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container/**"
      - "scripts/**"
      - ".trivyignore.yaml"
      - "Makefile"
      - ".github/workflows/trivy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: localhost/ffreis/stock-simulator
    steps:
      - uses: actions/checkout@v6
      - name: Install Podman
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build images
        run: |
          set -euo pipefail
          podman build -f container/Dockerfile -t "${IMAGE_NAME}" .
      - name: Install Trivy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version
      - name: Scan images (sequential, archive input)
        run: |
          set -euo pipefail
          mkdir -p trivy-results
          images=("${IMAGE_NAME}")

          # Warm DB once.
          trivy image --download-db-only --no-progress

          for image in "${images[@]}"; do
            name="${image##*/}"
            archive="trivy-results/${name}.docker.tar"
            podman save --format docker-archive --output "${archive}" "${image}"

            trivy image \
              --input "${archive}" \
              --skip-db-update \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              --scanners vuln \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format sarif \
              --output "trivy-results/${name}.sarif"
            test -s "trivy-results/${name}.sarif"

            trivy image \
              --input "${archive}" \
              --skip-db-update \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              --scanners vuln \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format json \
              --output "trivy-results/${name}.json"
            test -s "trivy-results/${name}.json"

            echo "Full vulnerability report for ${image} (all severities):"
            trivy image \
              --input "${archive}" \
              --skip-db-update \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              --scanners vuln \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format table

            echo "Gating ${image} on HIGH/CRITICAL vulnerabilities..."
            trivy image \
              --input "${archive}" \
              --skip-db-update \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format json \
              --output "trivy-results/${name}.gate.json"

            trivy image \
              --input "${archive}" \
              --skip-db-update \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format table \
              --output "trivy-results/${name}.gate.table"

            vuln_count="$(
              python -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8")); print(sum(len(x.get("Vulnerabilities") or []) for x in r.get("Results", [])))' "trivy-results/${name}.gate.json"
            )"

            echo "HIGH/CRITICAL findings for ${image}: ${vuln_count}"
            if [ "${vuln_count}" -gt 0 ]; then
              echo "Top HIGH/CRITICAL findings for ${image}:"
              cat "trivy-results/${name}.gate.table"
              echo "FAIL" > "trivy-results/${name}.gate-status"
            else
              # Keep Trivy's native non-zero gate as a safety net.
              trivy image \
                --input "${archive}" \
                --skip-db-update \
                --no-progress \
                --ignorefile .trivyignore.yaml \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --format table >/dev/null
              echo "PASS" > "trivy-results/${name}.gate-status"
            fi
          done
      - name: Upload Trivy JSON reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-json-reports
          path: trivy-results/*.json
          if-no-files-found: error
      - name: Upload Trivy SARIF (per image)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        shell: bash
        run: |
          set -euo pipefail
          for f in trivy-results/*.sarif; do
            name="$(basename "$f" .sarif)"
            echo "Uploading $f with tool_name trivy-$name"
            sarif_payload="$(gzip -c "$f" | base64 | tr -d '\n')"
            gh api \
              -X POST \
              /repos/${{ github.repository }}/code-scanning/sarifs \
              -f sarif="${sarif_payload}" \
              -f tool_name="trivy-${name}" \
              -f commit_sha="${{ github.sha }}" \
              -f ref="${{ github.ref }}"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check gate results
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          gate_files=(trivy-results/*.gate-status)
          if [ ${#gate_files[@]} -eq 0 ]; then
            echo "::error::No gate status files found - scans may not have completed"
            exit 1
          fi
          for f in "${gate_files[@]}"; do
            name="$(basename "$f" .gate-status)"
            status="$(cat "$f")"
            if [ "$status" = "FAIL" ]; then
              echo "::error::Image ${name} failed HIGH/CRITICAL vulnerability gate"
              failed=1
            elif [ "$status" = "PASS" ]; then
              echo "Image ${name} passed HIGH/CRITICAL vulnerability gate"
            else
              echo "::error::Image ${name} has unexpected gate status: ${status}"
              failed=1
            fi
          done
          exit $failed
