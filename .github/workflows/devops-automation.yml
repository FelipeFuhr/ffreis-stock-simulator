name: DevOps / Automation

permissions: {}

on:
  schedule:
    - cron: "16 10 3 * *"  # monthly scattered (was: 0 3 * * 0)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    if: vars.SCORECARD_ENABLED == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scorecard.yml@c05b308fe568045ac1c8086436cca5011b809454 # v2.0.0
    with:
      upload-sarif: true
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  stale:
    if: vars.STALE_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-stale.yml@c05b308fe568045ac1c8086436cca5011b809454 # v2.0.0
    with:
      only: "both"
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  release-please:
    if: vars.RELEASE_PLEASE_ENABLED == 'true' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-release-please.yml@c05b308fe568045ac1c8086436cca5011b809454 # v2.0.0
    with:
      target-branch: "main"
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
