name: Lock Sync

permissions: {}

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-lock-sync.yml@8405bfc6e887b6e1af634a6ed104538ab98d3baf # main (post-#98)
    with:
      python-version: "3.13"
