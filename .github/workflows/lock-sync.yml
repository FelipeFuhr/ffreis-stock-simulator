name: Lock Sync

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock-sync:
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-lock-sync.yml@v1.0.5
    with:
      python-version: "3.13"
