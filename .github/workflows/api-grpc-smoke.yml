name: API + gRPC Smoke

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-grpc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and run compose smoke test
        run: |
          make smoke-api-grpc

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose -f examples/docker-compose.api-grpc.yml down -v --remove-orphans
