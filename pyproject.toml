[project]
name = "ffreis-stock-simulator"
version = "0.1.0"
description = "Stock market simulation environment and service."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "numba>=0.60.0",
    "numpy>=2.1.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "prometheus-client>=0.20.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
stock-simulator = "stock_simulator.server:main"
stock-simulator-grpc = "stock_simulator.grpc.server:main"

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0.240909",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12.20241230",
]
grpc = [
    "grpcio>=1.78.0",
    "protobuf>=6.31.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_simulator", "src/stocksim_grpc"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/integration_tests", "tests/e2e_tests"]
addopts = "--strict-markers --tb=short -ra --import-mode=importlib"
pythonpath = ["src"]
markers = [
    "unit: fast isolated tests",
    "integration: tests spanning multiple modules/files",
    "e2e: end-to-end tests using public entrypoints",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["src/stocksim_grpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src/stock_simulator"]
mypy_path = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
exclude = "^src/stocksim_grpc/.*"

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["stocksim_grpc", "stocksim_grpc.*"]
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
